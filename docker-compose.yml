services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pgrag_postgres_17
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgrag_user
      POSTGRES_PASSWORD: pgrag_password
      POSTGRES_DB: pgrag_inspector
    ports:
      - "54329:5432"
    volumes:
      - pgrag_pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=128MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgrag_user -d pgrag_inspector"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgrag_pgdata: